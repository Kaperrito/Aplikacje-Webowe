<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizytowka - Kacper</title>
    <style>
        * {
            box-sizing: border-box;
        }
        section{
            margin: 1.5%;
        }

        .kolumna{
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: large;
        }

        .obraz {
            width: 10%;
            height: 10%;
        }

        .ramka{
            width: 20%;
            border: solid 1px black;
            border-radius: 5%;
            box-shadow: 5px 5px;
        }

        .formularz{
            padding: 1.5%;
        }
        .formularz label {
            display: inline-block;
            width: 30%;
            padding: 3px;
        }

        .formularz input, .formularz select,.formularz textarea {
            width: 40%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <header class="kolumna naglowek">
        <h1>Kacper 5p1t</h1>
        <img class="obraz" alt="Zdjecie profilowe" src="https://media.istockphoto.com/id/2168774111/vector/avatar-or-person-sign-profile-picture-portrait-icon-user-profile-symbol.jpg?s=612x612&w=0&k=20&c=6qw1LRG53z00RXJnVKQC58W7XnW2gdQfGBIR43E97Oc=">
    </header>
    
    <main class="kolumna">
        <section class="ramka kolumna">
            <h2>Umiejetności</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JS</li>
                <li>PHP</li>
                <li>C#</li>
                <li>C++</li>
            </ul>
        </section>
        
        <section class="ramka formularz">
            <form>
                <label for="imie">Imie:</label>
                <input type="text" name="imie" id="imie" required><br>

                <label for="e_mail">Email:</label>
                <input type="email" name="e_mail" id="e_mail" required><br>

                <label for="wiadomosc">Wiadomość:</label>
                <textarea name="wiadomosc" id="wiadomosc" rows="3"></textarea><br>

                <label for="temat">Temat:</label>
                <select id="temat" name="temat">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select><br>
                <button type="submit">Wyslij</button>
            </form>
        </section>
       
    </main>

</body>

</html>
